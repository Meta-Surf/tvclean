# Importa Free My TV sem computador local.
# O repositório de destino TVClean permanece independente dos workflows upstream.
name: Importar base Free My TV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'Meta-Surf/tvclean'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TVClean
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Importar upstream preservando autoria, licença e histórico
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/simbasjungles/free-my-tv.git
          git fetch upstream main
          if [ -f app/src/io/freemytv/HomeView.java ]; then
            echo "Base já importada."
            exit 0
          fi
          # Evita herdar os workflows externos, para respeitar o isolamento
          # e a restrição de workflow permissions do token GitHub Actions.
          git merge --allow-unrelated-histories --no-commit --no-ff upstream/main
          git rm -f .github/workflows/check.yml .github/workflows/pages.yml
          git commit -m "Import Free My TV source and history (MIT, no upstream workflows)"
          test -f LICENSE
          test -f app/src/io/freemytv/HomeView.java
          git push origin HEAD:main
